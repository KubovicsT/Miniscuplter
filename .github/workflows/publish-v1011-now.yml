name: publish-v1.0.11-now

on:
  push:
    branches: [ 'release-publish-v1.0.11' ]

permissions:
  contents: write

jobs:
  publish-v1011:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact validated v1.0.11 head
        uses: actions/checkout@v4
        with:
          ref: 0e467ae67d7eda105ff8dd0c1e5c74f2da4cc060

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Re-run strict release validation
        shell: pwsh
        run: |
          dotnet restore Miniscuplter.csproj
          if ($LASTEXITCODE -ne 0) { throw "Editor restore failed: $LASTEXITCODE" }
          dotnet restore Launcher/Miniscuplter.Launcher.csproj
          if ($LASTEXITCODE -ne 0) { throw "Launcher restore failed: $LASTEXITCODE" }
          dotnet restore Updater/Miniscuplter.Updater.csproj
          if ($LASTEXITCODE -ne 0) { throw "Updater restore failed: $LASTEXITCODE" }
          dotnet build Miniscuplter.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Editor build failed: $LASTEXITCODE" }
          dotnet build Launcher/Miniscuplter.Launcher.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed: $LASTEXITCODE" }
          dotnet build Updater/Miniscuplter.Updater.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Updater build failed: $LASTEXITCODE" }
          python -m compileall -q ai_backend tools
          if ($LASTEXITCODE -ne 0) { throw "Python compile failed: $LASTEXITCODE" }
          python tools/core_logic_tests.py
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed: $LASTEXITCODE" }
          python tools/release_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Release audit failed: $LASTEXITCODE" }

      - name: Verify four-step workflow and launch grid guards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $workflow=Get-Content 'Scripts/Main.V1011Workflow.cs' -Raw
          $extras=Get-Content 'Scripts/ExtrasInstaller.cs' -Raw
          foreach ($token in @('WorkflowPage("2D")','WorkflowPage("3D")','WorkflowPage("Rig & Pose")','WorkflowPage("Cleanup & Export")','Accept Current Image as Baseline','MoveV1011SculptControlsTo3D','AttachV1011AdvancedSettings','RepairV1011ViewportAtLaunch','AddV1011Grid')) {
            if (-not $workflow.Contains($token)) { throw "Missing v1.0.11 workflow token: $token" }
          }
          if (-not $extras.Contains('InstallV1011Workflow();')) { throw 'v1.0.11 workflow installer is not wired into ExtrasInstaller.' }
          if ($extras.IndexOf('InstallV1011Workflow();') -gt $extras.IndexOf('InstallV109ResponsiveLayout();')) { throw 'Workflow consolidation must run before responsive wrapping.' }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download and verify Godot 4.7.2 .NET and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip'
          $t='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz'
          New-Item '.ci/godot' -ItemType Directory -Force | Out-Null
          Invoke-WebRequest $g -OutFile '.ci/godot.zip'
          Invoke-WebRequest $t -OutFile '.ci/templates.tpz'
          if ((Get-FileHash '.ci/godot.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') { throw 'Godot SHA mismatch' }
          if ((Get-FileHash '.ci/templates.tpz' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d') { throw 'Template SHA mismatch' }
          Expand-Archive '.ci/godot.zip' '.ci/godot' -Force
          Expand-Archive '.ci/templates.tpz' '.ci/templates' -Force
          $templateHome=Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable.mono'
          New-Item $templateHome -ItemType Directory -Force | Out-Null
          Copy-Item '.ci/templates/templates/*' $templateHome -Recurse -Force
          $exe=Get-ChildItem '.ci/godot' -Filter 'Godot_v4.7.2-stable_mono_win64.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Godot executable not found after extraction.' }
          "GODOT_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build full Windows v1.0.11 release
        shell: pwsh
        run: |
          ./build_release.ps1 -GodotExe $env:GODOT_EXE -BuildInstaller
          if ($LASTEXITCODE -ne 0) { throw "Full release build failed: $LASTEXITCODE" }

      - name: Verify release outputs and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @(
            'dist/package/App/Miniscuplter.exe',
            'dist/package/release.json',
            'dist/Miniscuplter-win-x64.zip',
            'dist/Miniscuplter-win-x64.zip.sha256',
            'dist/installer/Miniscuplter-Setup-1.0.11.exe'
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing release output: $_" } }
          $manifest=Get-Content 'dist/package/release.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne '1.0.11') { throw "release.json version $($manifest.version) != 1.0.11" }
          $expected=((Get-Content 'dist/Miniscuplter-win-x64.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash 'dist/Miniscuplter-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Release ZIP SHA-256 mismatch: $actual != $expected" }

      - name: Smoke-install generated installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'MiniscuplterInstallerSmoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $setup=(Resolve-Path 'dist/installer/Miniscuplter-Setup-1.0.11.exe').Path
          $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target",'/NOICONS','/TASKS=')
          $process=Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke test exited with code $($process.ExitCode)." }
          @(
            (Join-Path $target 'Miniscuplter.Launcher.exe'),
            (Join-Path $target 'Miniscuplter.Updater.exe'),
            (Join-Path $target 'App\Miniscuplter.exe'),
            (Join-Path $target 'release.json')
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Installer smoke test missing installed file: $_" } }

      - name: Publish v1.0.11 GitHub Release at exact app commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v1.0.11 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.0.11 already exists; refusing to replace a published release.' }
          gh release create v1.0.11 `
            'dist/Miniscuplter-win-x64.zip' `
            'dist/Miniscuplter-win-x64.zip.sha256' `
            'dist/installer/Miniscuplter-Setup-1.0.11.exe' `
            --repo $env:GITHUB_REPOSITORY `
            --target 0e467ae67d7eda105ff8dd0c1e5c74f2da4cc060 `
            --title 'Miniscuplter v1.0.11' `
            --notes 'Workflow consolidation release. The editor now presents one four-step user workflow: 2D baseline, 3D create/edit, Rig & Pose, and Cleanup & Export. Existing sculpt, mask/refinement, kitbash, rigging, mesh analysis/repair and export features are rehomed by task rather than historical version. Advanced model/runtime/quality/file controls move under Settings. 3D generation requires an explicitly accepted 2D baseline. The viewport/grid launch path is hardened so the brighter 10 mm / 50 mm grid and X/Z axes are rebuilt and shown immediately. Existing AI models, runtime caches, projects and user data remain preserved by the updater.'
