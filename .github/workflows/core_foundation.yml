name: core-foundation

on:
  push:
    branches: [ 'v1*' ]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore Stage-B core tests
        run: dotnet restore Core.Tests/Miniscuplter.Core.Tests.csproj
      - name: Build Stage-B core
        run: dotnet build Core.Tests/Miniscuplter.Core.Tests.csproj -c Release --no-restore
      - name: Run Stage-B foundation regression tests
        run: dotnet run --project Core.Tests/Miniscuplter.Core.Tests.csproj -c Release --no-build
