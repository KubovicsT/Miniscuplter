name: autonomous-release

on:
  push:
    branches: [ release-control ]
    paths:
      - 'release-requests/*.json'

# The request job only needs read access. The publish job elevates contents permission
# only after the exact candidate has passed every release gate.
permissions:
  contents: read

concurrency:
  group: miniscuplter-autonomous-release
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.request.outputs.version }}
      candidate_sha: ${{ steps.request.outputs.candidate_sha }}
      source_branch: ${{ steps.request.outputs.source_branch }}
    steps:
      - name: Check out release-control request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate exactly one release request
        id: request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $before = [string]$env:PUSH_BEFORE
          if ($before -match '^0+$') {
            $changed = @(git diff-tree --root --no-commit-id --name-only -r $env:GITHUB_SHA | Where-Object { $_ -match '^release-requests/v1\.\d+\.\d+\.json$' })
          }
          else {
            $changed = @(git diff --name-only $before $env:GITHUB_SHA -- 'release-requests/*.json' | Where-Object { $_ -match '^release-requests/v1\.\d+\.\d+\.json$' })
          }
          $changed = @($changed | Sort-Object -Unique)
          if ($changed.Count -ne 1) {
            throw "Expected exactly one changed release-requests/v1.x.y.json file in this push; found $($changed.Count)."
          }

          $requestPath = $changed[0]
          $request = Get-Content $requestPath -Raw | ConvertFrom-Json
          $version = [string]$request.version
          $sourceBranch = [string]$request.source_branch
          $candidate = ([string]$request.candidate_sha).ToLowerInvariant()

          if ($version -notmatch '^v1\.\d+\.\d+$') { throw "Invalid release version: $version" }
          if ($sourceBranch -ne $version) { throw "Source branch must exactly match release version ($version); got $sourceBranch" }
          if ($candidate -notmatch '^[0-9a-f]{40}$') { throw "candidate_sha must be a full 40-character commit SHA." }
          if ([IO.Path]::GetFileNameWithoutExtension($requestPath) -ne $version) {
            throw "Request filename must match version exactly: release-requests/$version.json"
          }

          git fetch origin "refs/heads/${sourceBranch}:refs/remotes/origin/${sourceBranch}" --force
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch source branch $sourceBranch." }
          $branchHead = (git rev-parse "refs/remotes/origin/$sourceBranch").Trim().ToLowerInvariant()
          if ($branchHead -ne $candidate) {
            throw "Release request is stale: $sourceBranch is now $branchHead, requested candidate is $candidate."
          }

          $existingTag = (git ls-remote --tags origin "refs/tags/$version" | Out-String).Trim()
          if ($existingTag) { throw "Tag $version already exists; published/version tags are immutable." }

          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release $version already exists; releases are immutable." }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_branch=$sourceBranch" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate_sha=$candidate" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Validated release request $version at $candidate from $sourceBranch."

      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore and build C# targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Miniscuplter.csproj
          dotnet restore Launcher/Miniscuplter.Launcher.csproj
          dotnet restore Updater/Miniscuplter.Updater.csproj
          dotnet restore Core.Tests/Miniscuplter.Core.Tests.csproj
          dotnet build Miniscuplter.csproj -c Release --no-restore
          dotnet build Launcher/Miniscuplter.Launcher.csproj -c Release --no-restore
          dotnet build Updater/Miniscuplter.Updater.csproj -c Release --no-restore
          dotnet build Core.Tests/Miniscuplter.Core.Tests.csproj -c Release --no-restore
          dotnet run --project Core.Tests/Miniscuplter.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Compile backend and resolve runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q ai_backend tools
          python -m pip install --dry-run --ignore-installed -r ai_backend/requirements.txt

      - name: Run core and job regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/core_logic_tests.py
          python tools/job_progress_tests.py

      - name: Install geometry regression dependencies
        run: python -m pip install "numpy<2.3" "trimesh>=4.4,<6" "scipy>=1.13" "scikit-image>=0.24" "rtree>=1.3,<2"

      - name: Run geometry regressions and release audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/geometry_regression_tests.py
          python tools/release_audit.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download and verify Godot 4.7.2 .NET and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip'
          $t='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz'
          New-Item '.ci/godot' -ItemType Directory -Force | Out-Null
          Invoke-WebRequest $g -OutFile '.ci/godot.zip'
          Invoke-WebRequest $t -OutFile '.ci/templates.tpz'
          if ((Get-FileHash '.ci/godot.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') { throw 'Godot SHA mismatch' }
          if ((Get-FileHash '.ci/templates.tpz' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d') { throw 'Template SHA mismatch' }
          Expand-Archive '.ci/godot.zip' '.ci/godot' -Force
          Expand-Archive '.ci/templates.tpz' '.ci/templates' -Force
          $templateHome=Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable.mono'
          New-Item $templateHome -ItemType Directory -Force | Out-Null
          Copy-Item '.ci/templates/templates/*' $templateHome -Recurse -Force
          $exe=Get-ChildItem '.ci/godot' -Filter 'Godot_v4.7.2-stable_mono_win64.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Godot executable not found after verified extraction.' }
          "GODOT_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build full Windows release from exact candidate
        shell: pwsh
        run: ./build_release.ps1 -GodotExe $env:GODOT_EXE -BuildInstaller

      - name: Verify versioned release outputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION.TrimStart('v')
          @(
            'dist/package/App/Miniscuplter.exe',
            'dist/package/release.json',
            'dist/Miniscuplter-win-x64.zip',
            'dist/Miniscuplter-win-x64.zip.sha256',
            "dist/installer/Miniscuplter-Setup-$version.exe"
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing full release output: $_" } }
          $manifest = Get-Content 'dist/package/release.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $version) { throw "release.json version $($manifest.version) != requested version $version" }
          $expected = ((Get-Content 'dist/Miniscuplter-win-x64.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'dist/Miniscuplter-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Release ZIP SHA-256 mismatch: $actual != $expected" }

      - name: Smoke-install generated installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $target = Join-Path $env:RUNNER_TEMP 'MiniscuplterInstallerSmoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $setup = (Resolve-Path "dist/installer/Miniscuplter-Setup-$version.exe").Path
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target",'/NOICONS','/TASKS=')
          $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke test exited with code $($process.ExitCode)." }
          @(
            (Join-Path $target 'Miniscuplter.Launcher.exe'),
            (Join-Path $target 'Miniscuplter.Updater.exe'),
            (Join-Path $target 'App\Miniscuplter.exe'),
            (Join-Path $target 'release.json')
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Installer smoke test missing installed file: $_" } }

      - name: Stage immutable release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION.TrimStart('v')
          New-Item 'dist/release' -ItemType Directory -Force | Out-Null
          Copy-Item 'dist/Miniscuplter-win-x64.zip' 'dist/release/Miniscuplter-win-x64.zip' -Force
          Copy-Item 'dist/Miniscuplter-win-x64.zip.sha256' 'dist/release/Miniscuplter-win-x64.zip.sha256' -Force
          Copy-Item "dist/installer/Miniscuplter-Setup-$version.exe" "dist/release/Miniscuplter-Setup-$version.exe" -Force

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-release-package
          if-no-files-found: error
          retention-days: 30
          path: dist/release/*

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact candidate for tag creation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-build.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: autonomous-release-package
          path: release

      - name: Recheck immutable release target immediately before publication
        shell: bash
        env:
          VERSION: ${{ needs.validate-build.outputs.version }}
          SOURCE_BRANCH: ${{ needs.validate-build.outputs.source_branch }}
          CANDIDATE_SHA: ${{ needs.validate-build.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" --force
          branch_head="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          if [ "$branch_head" != "$CANDIDATE_SHA" ]; then
            echo "Release aborted: ${SOURCE_BRANCH} moved from ${CANDIDATE_SHA} to ${branch_head} during validation."
            exit 1
          fi

          remote_tag="$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk '{print $1}')"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$CANDIDATE_SHA" ]; then
            echo "Release aborted: existing tag ${VERSION} points to ${remote_tag}, not ${CANDIDATE_SHA}."
            exit 1
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; immutable releases are never overwritten."
            exit 1
          fi

          cd release
          sha256sum -c Miniscuplter-win-x64.zip.sha256

      - name: Create immutable lightweight version tag if absent
        shell: bash
        env:
          VERSION: ${{ needs.validate-build.outputs.version }}
          CANDIDATE_SHA: ${{ needs.validate-build.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk '{print $1}')"
          if [ -z "$remote_tag" ]; then
            git tag "$VERSION" "$CANDIDATE_SHA"
            git push origin "refs/tags/$VERSION"
          elif [ "$remote_tag" != "$CANDIDATE_SHA" ]; then
            echo "Existing tag target mismatch; refusing to rewrite immutable tag."
            exit 1
          else
            echo "Tag $VERSION already exists at the exact candidate, continuing idempotently."
          fi

      - name: Publish verified immutable GitHub Release
        shell: bash
        env:
          VERSION: ${{ needs.validate-build.outputs.version }}
          CANDIDATE_SHA: ${{ needs.validate-build.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_number="${VERSION#v}"
          installer="release/Miniscuplter-Setup-${version_number}.exe"
          test -f release/Miniscuplter-win-x64.zip
          test -f release/Miniscuplter-win-x64.zip.sha256
          test -f "$installer"

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; immutable releases are never overwritten."
            exit 1
          fi

          gh release create "$VERSION" \
            release/Miniscuplter-win-x64.zip \
            release/Miniscuplter-win-x64.zip.sha256 \
            "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "Miniscuplter $VERSION" \
            --notes "Verified autonomous Windows release for $VERSION. The exact requested candidate passed C# and Core tests, Python/runtime checks, geometry regressions, release audit, a real Godot 4.7.2 Windows export, ZIP/hash verification, installer creation, and a silent installer smoke-install before the immutable tag and release were published."
