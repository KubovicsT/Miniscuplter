name: build

on:
  push:
    branches: [ main, v0.2, v0.3, v0.4 ]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Miniscuplter.csproj
      - name: Build
        run: dotnet build Miniscuplter.csproj --configuration Release --no-restore

  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile backend sources
        run: python -m compileall -q ai_backend
