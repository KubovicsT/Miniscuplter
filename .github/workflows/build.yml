name: build

on:
  push:
    branches: [ main, v0.2, v0.3, v0.4, v0.5, v0.5.5, v0.6, v0.7, v0.8, v0.9, v0.9.5, v0.9.6, v0.9.7, v0.9.8, v0.9.9, v1.0, v1.0.5 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Miniscuplter.csproj
      - run: dotnet restore Launcher/Miniscuplter.Launcher.csproj
        if: startsWith(github.ref_name, 'v1.0') || github.ref_name == 'v0.9.9' || github.event_name == 'pull_request'
      - run: dotnet restore Updater/Miniscuplter.Updater.csproj
        if: startsWith(github.ref_name, 'v1.0') || github.ref_name == 'v0.9.9' || github.event_name == 'pull_request'
      - name: Build C# targets
        shell: pwsh
        run: |
          dotnet build Miniscuplter.csproj -c Release --no-restore
          if ('${{ github.ref_name }}'.StartsWith('v1.0') -or '${{ github.ref_name }}' -eq 'v0.9.9' -or '${{ github.event_name }}' -eq 'pull_request') {
            dotnet build Launcher/Miniscuplter.Launcher.csproj -c Release --no-restore
            dotnet build Updater/Miniscuplter.Updater.csproj -c Release --no-restore
          }

  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Compile backend sources
        run: python -m compileall -q ai_backend tools
      - name: Resolve AI runtime dependencies
        if: startsWith(github.ref_name, 'v1.0') || github.event_name == 'pull_request'
        run: python -m pip install --dry-run --ignore-installed -r ai_backend/requirements.txt
      - name: Run core logic tests
        if: startsWith(github.ref_name, 'v1.0') || github.event_name == 'pull_request'
        run: python tools/core_logic_tests.py
      - name: Run release audit
        if: startsWith(github.ref_name, 'v1.0') || github.event_name == 'pull_request'
        run: python tools/release_audit.py

  packaging:
    if: github.ref_name == 'v0.9.9' || startsWith(github.ref_name, 'v1.0') || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build portable package without Godot export
        shell: pwsh
        run: ./build_release.ps1 -SkipGodotExport
      - name: Verify package layout
        shell: pwsh
        run: |
          @('dist/package/Miniscuplter.Launcher.exe','dist/package/Miniscuplter.Updater.exe','dist/package/App/ai_backend/launcher_bridge.py','dist/package/setup_ai_backend.bat','dist/Miniscuplter-win-x64.zip') | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing package output: $_" } }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile installer definition
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          & $iscc installer/Miniscuplter.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed.' }

  full-windows-release:
    if: startsWith(github.ref_name, 'v1.0') && github.event_name != 'pull_request'
    needs: [dotnet, python-syntax, packaging]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: choco install innosetup -y --no-progress
      - name: Download and verify Godot 4.7.2 .NET and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $g='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip'; $t='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz'
          New-Item '.ci/godot' -ItemType Directory -Force|Out-Null; Invoke-WebRequest $g -OutFile '.ci/godot.zip'; Invoke-WebRequest $t -OutFile '.ci/templates.tpz'
          if ((Get-FileHash '.ci/godot.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') { throw 'Godot SHA mismatch' }
          if ((Get-FileHash '.ci/templates.tpz' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d') { throw 'Template SHA mismatch' }
          Expand-Archive '.ci/godot.zip' '.ci/godot' -Force; Expand-Archive '.ci/templates.tpz' '.ci/templates' -Force; $templateHome=Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable.mono'; New-Item $templateHome -ItemType Directory -Force|Out-Null; Copy-Item '.ci/templates/templates/*' $templateHome -Recurse -Force
          $exe=Get-ChildItem '.ci/godot' -Filter 'Godot_v4.7.2-stable_mono_win64.exe' -Recurse|Select-Object -First 1; "GODOT_EXE=$($exe.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build full Windows release
        shell: pwsh
        run: ./build_release.ps1 -GodotExe $env:GODOT_EXE -BuildInstaller
      - name: Verify v1.0.5 outputs
        shell: pwsh
        run: |
          @('dist/package/App/Miniscuplter.exe','dist/Miniscuplter-win-x64.zip','dist/installer/Miniscuplter-Setup-1.0.5.exe') | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing full release output: $_" } }
      - name: Smoke-install generated v1.0.5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'MiniscuplterInstallerSmoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $setup = (Resolve-Path 'dist/installer/Miniscuplter-Setup-1.0.5.exe').Path
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target",'/NOICONS','/TASKS=')
          $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke test exited with code $($process.ExitCode)." }
          @(
            (Join-Path $target 'Miniscuplter.Launcher.exe'),
            (Join-Path $target 'Miniscuplter.Updater.exe'),
            (Join-Path $target 'App\Miniscuplter.exe')
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Installer smoke test missing installed file: $_" } }
      - name: Upload installable v1.0.5 Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miniscuplter-v1.0.5-Windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/installer/Miniscuplter-Setup-1.0.5.exe
            dist/Miniscuplter-win-x64.zip
