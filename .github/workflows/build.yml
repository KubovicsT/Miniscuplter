name: build

on:
  push:
    branches: [ main, 'v*' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Miniscuplter.csproj
      - run: dotnet restore Launcher/Miniscuplter.Launcher.csproj
        if: startsWith(github.ref_name, 'v1.') || github.ref_name == 'v0.9.9' || github.event_name == 'pull_request'
      - run: dotnet restore Updater/Miniscuplter.Updater.csproj
        if: startsWith(github.ref_name, 'v1.') || github.ref_name == 'v0.9.9' || github.event_name == 'pull_request'
      - run: dotnet restore Core.Tests/Miniscuplter.Core.Tests.csproj
        if: startsWith(github.ref_name, 'v1.') || github.ref_name == 'v0.9.9' || github.event_name == 'pull_request'
      - name: Build C# targets
        shell: pwsh
        run: |
          dotnet build Miniscuplter.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Miniscuplter editor C# build failed with exit code $LASTEXITCODE." }
          if ('${{ github.ref_name }}'.StartsWith('v1.') -or '${{ github.ref_name }}' -eq 'v0.9.9' -or '${{ github.event_name }}' -eq 'pull_request') {
            dotnet build Launcher/Miniscuplter.Launcher.csproj -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Launcher C# build failed with exit code $LASTEXITCODE." }
            dotnet build Updater/Miniscuplter.Updater.csproj -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Updater C# build failed with exit code $LASTEXITCODE." }
            dotnet build Core.Tests/Miniscuplter.Core.Tests.csproj -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Canonical project-state tests failed to build with exit code $LASTEXITCODE." }
            dotnet run --project Core.Tests/Miniscuplter.Core.Tests.csproj -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Canonical project-state tests failed with exit code $LASTEXITCODE." }
          }

  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify semantic-version branch identity
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v1.')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $checks = @(
            @{ Path = 'Launcher/Miniscuplter.Launcher.csproj'; Token = "<Version>$version</Version>"; Label = 'launcher' },
            @{ Path = 'Updater/Miniscuplter.Updater.csproj'; Token = "<Version>$version</Version>"; Label = 'updater' },
            @{ Path = 'Miniscuplter.csproj'; Token = "<Version>$version</Version>"; Label = 'editor assembly' },
            @{ Path = 'installer/Miniscuplter.iss'; Token = "#define MyAppVersion `"$version`""; Label = 'installer' },
            @{ Path = 'export_presets.cfg'; Token = "application/file_version=`"$version.0`""; Label = 'Windows file version' },
            @{ Path = 'export_presets.cfg'; Token = "application/product_version=`"$version.0`""; Label = 'Windows product version' },
            @{ Path = 'ai_backend/app.py'; Token = "APP_VERSION = `"$version`""; Label = 'backend API' },
            @{ Path = 'Scripts/Main.V100Release.cs'; Token = "Ready — Miniscuplter v$version"; Label = 'editor display' },
            @{ Path = 'tools/release_audit.py'; Token = "EXPECTED = `"$version`""; Label = 'release audit' }
          )
          $mismatches = @()
          foreach ($check in $checks) {
            if (-not (Test-Path $check.Path)) {
              $mismatches += "$($check.Label): missing $($check.Path)"
              continue
            }
            $content = Get-Content $check.Path -Raw
            if (-not $content.Contains($check.Token)) {
              $mismatches += "$($check.Label): expected '$($check.Token)' in $($check.Path)"
            }
          }
          if ($mismatches.Count -gt 0) {
            $detail = $mismatches -join "`n - "
            throw "Semantic-version branch ${{ github.ref_name }} has stale release identity:`n - $detail"
          }
          Write-Host "Semantic-version identity matches branch ${{ github.ref_name }} across all release surfaces."
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Compile backend sources
        run: python -m compileall -q ai_backend tools
      - name: Resolve AI runtime dependencies
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python -m pip install --dry-run --ignore-installed -r ai_backend/requirements.txt
      - name: Run core logic tests
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/core_logic_tests.py
      - name: Run execution foundation tests
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/job_progress_tests.py
      - name: Run durable job journal tests
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/job_journal_tests.py
      - name: Run compact workspace regression tests
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/ui_density_tests.py
      - name: Install geometry regression dependencies
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python -m pip install "numpy<2.3" "trimesh>=4.4,<6" "scipy>=1.13" "scikit-image>=0.24" "rtree>=1.3,<2"
      - name: Install backend lifecycle test dependencies
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python -m pip install "fastapi==0.116.1" "uvicorn==0.35.0" "requests==2.32.4" "pydantic==2.11.7" "Pillow>=10.4.0"
      - name: Run canonical backend lifecycle test
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/backend_lifecycle_tests.py
      - name: Run real geometry regression tests
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/geometry_regression_tests.py
      - name: Run release audit
        if: startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
        run: python tools/release_audit.py

  packaging:
    if: github.ref_name == 'v0.9.9' || startsWith(github.ref_name, 'v1.') || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build portable package without Godot export
        shell: pwsh
        run: ./build_release.ps1 -SkipGodotExport
      - name: Verify package layout
        shell: pwsh
        run: |
          @(
            'dist/package/Miniscuplter.Launcher.exe',
            'dist/package/Miniscuplter.Updater.exe',
            'dist/package/App/ai_backend/launcher_bridge.py',
            'dist/package/App/ai_backend/serve.py',
            'dist/package/setup_ai_backend.bat',
            'dist/package/release.json',
            'dist/Miniscuplter-win-x64.zip',
            'dist/Miniscuplter-win-x64.zip.sha256'
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing package output: $_" } }
      - name: Verify portable ZIP SHA-256 sidecar
        shell: pwsh
        run: |
          $expected = ((Get-Content 'dist/Miniscuplter-win-x64.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'dist/Miniscuplter-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP SHA-256 mismatch: $actual != $expected" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile installer definition
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          & $iscc installer/Miniscuplter.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed.' }

  # Branch pushes are validation-only. Installable releases are built only from an explicit
  # final v1.x tag so intermediate commits on a version branch can never publish prematurely.
  full-windows-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    needs: [dotnet, python-syntax, packaging]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: choco install innosetup -y --no-progress
      - name: Download and verify Godot 4.7.2 .NET and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $g='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip'; $t='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz'
          New-Item '.ci/godot' -ItemType Directory -Force|Out-Null; Invoke-WebRequest $g -OutFile '.ci/godot.zip'; Invoke-WebRequest $t -OutFile '.ci/templates.tpz'
          if ((Get-FileHash '.ci/godot.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') { throw 'Godot SHA mismatch' }
          if ((Get-FileHash '.ci/templates.tpz' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d') { throw 'Template SHA mismatch' }
          Expand-Archive '.ci/godot.zip' '.ci/godot' -Force; Expand-Archive '.ci/templates.tpz' '.ci/templates' -Force; $templateHome=Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable.mono'; New-Item $templateHome -ItemType Directory -Force|Out-Null; Copy-Item '.ci/templates/templates/*' $templateHome -Recurse -Force
          $exe=Get-ChildItem '.ci/godot' -Filter 'Godot_v4.7.2-stable_mono_win64.exe' -Recurse|Select-Object -First 1; "GODOT_EXE=$($exe.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build full Windows release
        shell: pwsh
        run: ./build_release.ps1 -GodotExe $env:GODOT_EXE -BuildInstaller
      - name: Verify versioned release outputs
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          @(
            'dist/package/App/Miniscuplter.exe',
            'dist/package/release.json',
            'dist/Miniscuplter-win-x64.zip',
            'dist/Miniscuplter-win-x64.zip.sha256',
            "dist/installer/Miniscuplter-Setup-$version.exe"
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing full release output: $_" } }
          $manifest = Get-Content 'dist/package/release.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $version) { throw "release.json version $($manifest.version) != tag version $version" }
          $expected = ((Get-Content 'dist/Miniscuplter-win-x64.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'dist/Miniscuplter-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Release ZIP SHA-256 mismatch: $actual != $expected" }
      - name: Smoke-install generated installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $target = Join-Path $env:RUNNER_TEMP 'MiniscuplterInstallerSmoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $setup = (Resolve-Path "dist/installer/Miniscuplter-Setup-$version.exe").Path
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target",'/NOICONS','/TASKS=')
          $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke test exited with code $($process.ExitCode)." }
          @(
            (Join-Path $target 'Miniscuplter.Launcher.exe'),
            (Join-Path $target 'Miniscuplter.Updater.exe'),
            (Join-Path $target 'App\Miniscuplter.exe'),
            (Join-Path $target 'release.json')
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Installer smoke test missing installed file: $_" } }
      - name: Stage immutable release assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          New-Item 'dist/release' -ItemType Directory -Force | Out-Null
          Copy-Item 'dist/Miniscuplter-win-x64.zip' 'dist/release/Miniscuplter-win-x64.zip' -Force
          Copy-Item 'dist/Miniscuplter-win-x64.zip.sha256' 'dist/release/Miniscuplter-win-x64.zip.sha256' -Force
          Copy-Item "dist/installer/Miniscuplter-Setup-$version.exe" "dist/release/Miniscuplter-Setup-$version.exe" -Force
      - name: Upload installable Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          if-no-files-found: error
          retention-days: 30
          path: dist/release/*

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    needs: [full-windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Verify release ZIP before publication
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c Miniscuplter-win-x64.zip.sha256
      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          installer="release/Miniscuplter-Setup-${version}.exe"
          test -f release/Miniscuplter-win-x64.zip
          test -f release/Miniscuplter-win-x64.zip.sha256
          test -f "$installer"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published release versions are immutable, so no assets will be replaced."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            release/Miniscuplter-win-x64.zip \
            release/Miniscuplter-win-x64.zip.sha256 \
            "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Miniscuplter $GITHUB_REF_NAME" \
            --notes "Verified Windows release for $GITHUB_REF_NAME. The launcher self-updater uses the exact ZIP size and SHA-256 before transactional installation and preserves AI models, interrupted downloads, runtime caches and user data."
