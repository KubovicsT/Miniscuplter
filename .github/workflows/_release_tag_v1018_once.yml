name: one-time v1.0.18 tag bridge

on:
  push:
    branches:
      - 'v1.0.18'

permissions:
  contents: write

jobs:
  create-tag:
    if: github.ref == 'refs/heads/v1.0.18'
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable tag for validated commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = 'v1.0.18';
            const target = 'ce2d876fc145e615d63bd8d9fc809610f6038301';
            const ref = `tags/${tag}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              core.info(`Tag ${tag} already exists; leaving it immutable.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: target
            });
            core.info(`Created immutable tag ${tag} at ${target}.`);
