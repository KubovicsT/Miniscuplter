name: one-time v1.0.18 release dispatch bridge

on:
  push:
    branches:
      - 'v1.0.18'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: github.ref == 'refs/heads/v1.0.18'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the tag-gated Windows release workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'v1.0.18',
              inputs: { release_tag: 'v1.0.18' }
            });
            core.info('Dispatched the v1.0.18 full Windows release workflow.');
