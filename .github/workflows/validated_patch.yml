name: validated-patch-request
on:
  push:
    branches: [patch-control]
    paths: ['patch-requests/*.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: miniscuplter-validated-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: request
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'patch-requests/*.json')
          [ "${#files[@]}" -eq 1 ]
          request="${files[0]}"
          echo "path=$request" >> "$GITHUB_OUTPUT"
          branch="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["target_branch"])' "$request")"
          echo "target_branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Apply validated patch
        shell: bash
        run: python3 patch-tools/apply_patch_request.py "${{ steps.request.outputs.path }}"

      - name: Dispatch target-branch validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.request.outputs.target_branch }}"
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "Dispatched build.yml validation for $branch."
